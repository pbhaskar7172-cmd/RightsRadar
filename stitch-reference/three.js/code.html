<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_12 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_12" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_12');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Colors from Design System
const colors = {
    navy: 0x0F2137,
    saffron: 0xE67E22,
    cream: 0xFDFCF8,
    beige: 0xD5CABD,
    white: 0xFFFFFF
};

// Groups for different scenes
const group = new THREE.Group();
scene.add(group);

// Create Abstract Elements
const createFloatingDoc = (y, r) => {
    const geometry = new THREE.PlaneGeometry(1, 1.4);
    const material = new THREE.MeshPhongMaterial({ 
        color: colors.white, 
        transparent: true, 
        opacity: 0.6,
        side: THREE.DoubleSide 
    });
    const doc = new THREE.Mesh(geometry, material);
    doc.position.set(Math.random() * 10 - 5, y, Math.random() * 5 - 10);
    doc.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
    return doc;
};

const docs = [];
for(let i=0; i<15; i++) {
    const doc = createFloatingDoc(Math.random() * 6 - 3, 0);
    group.add(doc);
    docs.push(doc);
}

// Connected Nodes (AI Network)
const nodesGeometry = new THREE.SphereGeometry(0.05, 16, 16);
const nodesMaterial = new THREE.MeshBasicMaterial({ color: colors.saffron });
const nodes = new THREE.Group();
const points = [];
for(let i=0; i<20; i++) {
    const node = new THREE.Mesh(nodesGeometry, nodesMaterial);
    const pos = new THREE.Vector3(Math.random() * 8 - 4, Math.random() * 4 - 2, Math.random() * 4 - 8);
    node.position.copy(pos);
    nodes.add(node);
    points.push(pos);
}
group.add(nodes);

// Lines between nodes
const lineMaterial = new THREE.LineBasicMaterial({ color: colors.navy, transparent: true, opacity: 0.2 });
const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
const line = new THREE.LineSegments(lineGeometry, lineMaterial);
group.add(line);

// Lights
const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);
const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
directionalLight.position.set(5, 5, 5);
scene.add(directionalLight);

camera.position.z = 5;

// Animation state
let time = 0;

function animate() {
    requestAnimationFrame(animate);
    time += 0.005;

    group.rotation.y = Math.sin(time * 0.5) * 0.1;
    group.position.y = Math.sin(time) * 0.2;

    docs.forEach((doc, i) => {
        doc.rotation.x += 0.002 * (i % 2 === 0 ? 1 : -1);
        doc.rotation.y += 0.001;
        doc.position.y += Math.sin(time + i) * 0.005;
    });

    nodes.children.forEach((node, i) => {
        node.position.y += Math.cos(time + i) * 0.002;
    });

    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_12 -->
</body>
</html>
